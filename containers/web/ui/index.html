<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>42 — Spacecraft Dynamics Simulation</title>

   <!-- Three.js via import map (CDN) -->
   <script type="importmap">
   {
      "imports": {
         "three": "https://unpkg.com/three@0.172.0/build/three.module.js",
         "three/addons/": "https://unpkg.com/three@0.172.0/examples/jsm/"
      }
   }
   </script>

   <link rel="stylesheet" href="styles.css">
</head>
<body>
   <!-- Header -->
   <header id="app-header">
      <h1>42 <span class="subtitle">Spacecraft Dynamics Simulation</span></h1>
   </header>

   <!-- Main layout: left panel + 3D viewer -->
   <div id="app-body">
      <!-- Left panel: controls + state -->
      <aside id="left-panel">
         <div id="control-panel"></div>
         <div id="state-panel"></div>
         <div id="file-browser-panel"></div>
      </aside>

      <!-- 3D viewer -->
      <main id="viewer-container"></main>
   </div>

   <!-- Bottom: console output -->
   <div id="console-panel"></div>

   <!-- Earth shaders (embedded) -->
   <script id="earthVertexShader" type="x-shader/x-vertex">
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vPosition;

      void main() {
         vUv = uv;
         vNormal = normalize(normalMatrix * normal);
         vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
         gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
   </script>

   <script id="earthFragmentShader" type="x-shader/x-fragment">
      uniform sampler2D uDayTexture;
      uniform vec3 uSunDirection;

      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vPosition;

      void main() {
         vec3 normal = normalize(vNormal);

         // Sun direction in view space
         float sunDot = dot(normal, normalize(uSunDirection));

         // Day/night blend with smooth terminator
         float dayFactor = smoothstep(-0.1, 0.2, sunDot);

         vec4 dayColor = texture2D(uDayTexture, vUv);
         vec3 nightColor = vec3(0.02, 0.02, 0.05); // Dark blue night

         vec3 color = mix(nightColor, dayColor.rgb, dayFactor);

         gl_FragColor = vec4(color, 1.0);
      }
   </script>

   <script id="atmosVertexShader" type="x-shader/x-vertex">
      varying vec3 vNormal;
      varying vec3 vPosition;

      void main() {
         vNormal = normalize(normalMatrix * normal);
         vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
         gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
   </script>

   <script id="atmosFragmentShader" type="x-shader/x-fragment">
      uniform vec3 uSunDirection;

      varying vec3 vNormal;
      varying vec3 vPosition;

      void main() {
         vec3 normal = normalize(vNormal);
         vec3 viewDir = normalize(-vPosition);

         // Rim lighting effect
         float rim = 1.0 - max(dot(viewDir, normal), 0.0);
         rim = pow(rim, 3.0);

         // Sun illumination
         float sunDot = max(dot(normal, normalize(uSunDirection)), 0.0);
         float atmoIntensity = rim * (0.3 + 0.7 * sunDot);

         vec3 atmoColor = vec3(0.3, 0.6, 1.0); // Blue atmosphere

         gl_FragColor = vec4(atmoColor, atmoIntensity * 0.6);
      }
   </script>

   <!-- Load WASM module, then bootstrap app -->
   <script>
      const wasmScript = document.createElement('script');
      wasmScript.src = '../42.js';
      wasmScript.onload = () => {
         /* 42.js loaded — create42Module is now available on window */
         const appScript = document.createElement('script');
         appScript.type = 'module';
         appScript.src = 'main.js';
         document.body.appendChild(appScript);
      };
      wasmScript.onerror = () => {
         document.getElementById('console-panel').innerHTML =
            '<pre style="color:#f44">Failed to load 42.wasm — is the WASM build complete?</pre>';
      };
      document.body.appendChild(wasmScript);
   </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>42 — Spacecraft Dynamics Simulation</title>

   <!-- Three.js via import map (CDN) -->
   <script type="importmap">
   {
      "imports": {
         "three": "https://unpkg.com/three@0.172.0/build/three.module.js",
         "three/addons/": "https://unpkg.com/three@0.172.0/examples/jsm/"
      }
   }
   </script>

   <link rel="stylesheet" href="styles.css">
</head>
<body>

   <!-- Header: Title + Toolbar -->
   <header id="app-header">
      <div id="toolbar">
         <span class="app-title">42</span>
         <span class="app-subtitle">Spacecraft Simulation</span>
         <div class="tb-sep"></div>
         <button class="tb-btn" id="btn-init" title="Initialize WASM module">Init</button>
         <button class="tb-btn" id="btn-run" disabled title="Run simulation">&#9654; Run</button>
         <button class="tb-btn" id="btn-pause" disabled title="Pause simulation">&#10074;&#10074;</button>
         <button class="tb-btn" id="btn-step" disabled title="Single step">Step</button>
         <button class="tb-btn" id="btn-reset" disabled title="Reset simulation">Reset</button>
         <div class="tb-sep"></div>
         <button class="tb-btn" id="btn-load-sample" title="Load sample configuration">Samples</button>
         <button class="tb-btn" id="btn-flush" disabled title="Flush outputs to host">Flush</button>
         <div class="tb-sep"></div>
         <label class="speed-control">
            Speed:
            <input type="range" id="speed-slider" min="1" max="1000" value="100" step="1">
            <span id="speed-value">100</span>
         </label>
         <span id="status-indicator" class="loading">Loading...</span>
         <span id="sync-indicator" class="sync-off" title="Server sync status">&#x2601;</span>
      </div>
   </header>

   <!-- App Body: Left Panel + Resize Handle + Main Content -->
   <div id="app-body">
      <aside id="left-panel">
         <div id="left-tabs">
            <button class="left-tab active" data-tab="files">Files</button>
            <button class="left-tab" data-tab="state">State</button>
            <button class="left-tab" data-tab="config">Config</button>
         </div>
         <div id="files-panel" class="left-panel-content active"></div>
         <div id="state-panel" class="left-panel-content"></div>
         <div id="config-panel" class="left-panel-content"></div>
      </aside>
      <div class="resize-h" id="resize-h"></div>
      <main id="main-content">
         <div id="tab-bar"></div>
         <div id="tab-content"></div>
      </main>
   </div>

   <!-- Vertical resize handle -->
   <div id="resize-v"></div>

   <!-- Console Panel -->
   <div id="console-panel">
      <div id="console-header">
         Console Output
         <span class="spacer"></span>
         <span id="console-line-count">0 lines</span>
         <button id="console-clear-btn">Clear</button>
      </div>
      <div id="console-output"></div>
   </div>

   <!-- Dialog Overlay -->
   <div class="dialog-overlay" id="dialog-overlay">
      <div class="dialog" id="dialog-content"></div>
   </div>

   <!-- Shaders are now inline in viewer/42gl.js -->

   <!-- Detect backend mode, then load app -->
   <script>
      function loadApp() {
         var s = document.createElement('script');
         s.type = 'module';
         s.src = 'main.js';
         document.body.appendChild(s);
      }

      function loadWasm() {
         var s = document.createElement('script');
         s.src = '../42.js';
         s.onload = loadApp;
         s.onerror = function() {
            document.getElementById('console-output').innerHTML =
               '<span class="err">Failed to load 42.wasm — is the WASM build complete?</span>';
         };
         document.body.appendChild(s);
      }

      /* Detect backend: server mode skips WASM, loads app directly */
      fetch('/api/mode')
         .then(function(r) { return r.ok ? r.json() : { mode: 'wasm' }; })
         .then(function(data) {
            window.__42_MODE = data.mode || 'wasm';
            if (data.mode === 'server') {
               loadApp();
            } else {
               loadWasm();
            }
         })
         .catch(function() {
            window.__42_MODE = 'wasm';
            loadWasm();
         });
   </script>
</body>
</html>

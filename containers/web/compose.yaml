# compose.yaml — Docker Compose for 42 Web UI
#
# Usage:
#   cd containers/web
#   docker compose build
#   docker compose up -d 42-web-wasm      # WASM on :8042
#   docker compose up -d 42-web-server    # Native on :8043

services:
  42-web-wasm:
    build:
      context: .
      dockerfile: Containerfile
      target: fortytwo-web-wasm
      args:
        GIT_URL: https://github.com/ericstoneking/42.git
        GIT_BRANCH: master
    ports:
      - "${WASM_PORT:-8042}:8042"
    environment:
      PORT: 8042
      SESSION_DIR: /data/sessions
      DEFAULTS_DIR: /app/defaults/InOut
    volumes:
      - "./wasm/sessions:/data/sessions"
    restart: unless-stopped

  42-web-server:
    build:
      context: .
      dockerfile: Containerfile
      target: fortytwo-web-server
      args:
        GIT_URL: https://github.com/ericstoneking/42.git
        GIT_BRANCH: master
    ports:
      - "${WEB_PORT:-8043}:8043"
    environment:
      PORT: 8043
      INOUT_DIR: /app/InOut
      MODEL_DIR: /app/Model
      BIN_42: /app/42
    volumes:
      - "../../InOut:/app/InOut"
      - "../../Model:/app/Model"
    restart: unless-stopped

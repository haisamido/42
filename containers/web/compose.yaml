# compose.yaml — Docker Compose for 42 WASM Web UI
#
# Usage:
#   cd containers/web
#   docker compose build
#   docker compose up -d
#   open http://localhost:8042
#
# Each browser session gets its own directory under
# ./sessions/<datetime>/<uuid>/InOut/ populated with default InOut/ files
# on first access.

services:
  42-web:
    build:
      context: .
      dockerfile: Containerfile
      target: fortytwo-web
      args:
        GIT_URL: https://github.com/ericstoneking/42.git
        GIT_BRANCH: master
    ports:
      - "${PORT:-8042}:8042"
    environment:
      PORT: 8042
      SESSION_DIR: /data/sessions
      DEFAULTS_DIR: /app/defaults/InOut
    volumes:
      - "./sessions:/data/sessions"
    restart: unless-stopped
